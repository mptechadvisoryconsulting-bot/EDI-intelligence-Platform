name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        shell: bash
        run: |
          mapfile -d '' tests < <(find src/lib/__tests__ -type f -name '*.test.ts' -print0 | sort -z)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No unit tests found" >&2
            exit 1
          fi
          npx tsx --test "${tests[@]}"
